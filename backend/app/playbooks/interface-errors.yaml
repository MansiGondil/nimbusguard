name: interface-errors
title: Failing cable / port
description: Move traffic from a port with CRC errors onto the backup port.
triggers: [interface_errors]
risk: medium
requires_approval: false
steps:
  - action: snapshot_config
  - action: switch_to_backup_port
    params: {from_port: "Gi0/24", to_port: "Gi0/23"}
  - action: wait
    params: {seconds: 60}
  - action: verify
    params: {metric: if_errors, below: 10}
rollback:
  - action: restore_config
  - action: notify
    params: {message: "Backup port did not clear errors on {device}; on-site cable replacement needed"}
